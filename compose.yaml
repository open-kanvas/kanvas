services:
  kanvas:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      KANVAS_PUBLIC_URL: "${KANVAS_PUBLIC_URL:-http://127.0.0.1:8787}"
      KANVAS_PG_HOST: "${KANVAS_PG_HOST:?Set the reachable PostgreSQL host}"
      KANVAS_PG_PORT: "${KANVAS_PG_PORT:-5432}"
      KANVAS_PG_DATABASE: "${KANVAS_PG_DATABASE:-kanvas}"
      KANVAS_PG_USER: "${KANVAS_PG_USER:-kanvas}"
      KANVAS_PG_SSL: "${KANVAS_PG_SSL:-verify-full}"
      KANVAS_PG_PASSWORD_FILE: /run/secrets/kanvas_database_password
      KANVAS_MCP_PROFILE: "${KANVAS_MCP_PROFILE:-twelve}"
      KANVAS_ALLOW_REGISTRATION: "${KANVAS_ALLOW_REGISTRATION:-false}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - kanvas_state:/app/.kanvas
    secrets:
      - kanvas_database_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kanvas_state:

# PostgreSQL is deliberately separately provisioned. No database port is exposed
# and no weak/default password is generated by application startup.
secrets:
  kanvas_database_password:
    file: "${KANVAS_PG_PASSWORD_FILE:?Set a private service-readable password FILE path outside the checkout}"
